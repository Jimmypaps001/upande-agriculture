[project]
name = "upande_agriculture"
authors = [
    { name = "Upande", email = "teddy@upande.com"}
]
description = "Floriculture planning (Crop Protocol, Crop Cycle, Flower Trial, Budget/Forecast/Plan) for Mona Flowers"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# The Frappe major line this app is built against. bench and Frappe Cloud read this
# to decide whether the app can be installed on a given bench; without it they
# report "Could not find compatible Frappe version in pyproject.toml file" and the
# deploy stops there.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<=17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
    # ── Pre-existing backlog, not a blessing ─────────────────────────────────
    # All 71 hits predate the CI workflows (ruff has never gated this repo
    # before). Muted so the linter can enforce everything else from today;
    # clear them file-by-file and delete the codes as you go.
    "B007", # unused loop control variable
    "B905", # zip() without strict=
    "E731", # lambda assignment
    "F841", # assigned-but-unused local
    "RUF001", # ambiguous unicode in a string (— · → are deliberate)
    "RUF002", # ambiguous unicode in a docstring
    "RUF005", # list concatenation instead of unpacking
    "RUF012", # mutable class default
    "RUF015", # next(iter(x)) instead of x[0]
    "RUF046", # int() around an already-int value
    "RUF057", # round() on an int
    "RUF059", # unused unpacked variable
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
