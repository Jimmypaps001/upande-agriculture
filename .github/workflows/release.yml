name: Agriculture Release

on:
  push:
    branches:
      - develop

# Uses the auto-provided GITHUB_TOKEN. If `develop` is protected such that it
# cannot push the version bump commit, add a PAT secret named RELEASE_TOKEN
# (repo + workflow scopes) and use that instead below.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Version Bump + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "Upande Release Bot"
          GIT_AUTHOR_EMAIL: "info@upande.com"
          GIT_COMMITTER_NAME: "Upande Release Bot"
          GIT_COMMITTER_EMAIL: "info@upande.com"
        run: npx semantic-release
